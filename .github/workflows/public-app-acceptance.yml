# Test the published runtime and apps from a fresh runner.
name: Public app installation acceptance
on:
  workflow_dispatch:
    inputs:
      registry_ref:
        description: Public registry branch or commit to test
        type: string
        default: main
      download_origin:
        description: Published download origin
        type: choice
        default: https://rhyvenai.com
        options:
          - https://rhyvenai.com
          - https://rhyven.pages.dev
permissions:
  contents: read
jobs:
  download-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Wait for the published download origin
        env:
          RHYVEN_TEST_DOWNLOAD_ORIGIN: ${{ inputs.download_origin || 'https://rhyvenai.com' }}
        run: |
          for attempt in $(seq 1 80); do
            if test "$(curl -fsSL --max-time 10 "$RHYVEN_TEST_DOWNLOAD_ORIGIN/VERSION" 2>/dev/null)" = '0.5.4'; then
              exit 0
            fi
            echo "Waiting for the download origin to serve 0.5.4 ($attempt/80)"
            sleep 15
          done
          echo 'The runtime download origin is not ready; check DNS and the deployment.' >&2
          exit 1
  installer-vm:
    needs: download-ready
    uses: ./.github/workflows/installer-vm-acceptance.yml
    with:
      download_origin: ${{ inputs.download_origin || 'https://rhyvenai.com' }}
  public-install:
    needs: download-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RHYVEN_TEST_REGISTRY_REF: ${{ inputs.registry_ref }}
      RHYVEN_TEST_DOWNLOAD_ORIGIN: ${{ inputs.download_origin || 'https://rhyvenai.com' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download public runtime without GitHub credentials
        run: |
          mkdir runtime
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "$RHYVEN_TEST_DOWNLOAD_ORIGIN/releases/v0.5.4/rhyven-linux-x86_64" \
            --output runtime/rhyven-linux-x86_64
          sha256sum --check packaging/current-validator.sha256
          chmod +x runtime/rhyven-linux-x86_64
          test "$(runtime/rhyven-linux-x86_64 --version)" = 'rhyven 0.5.4'
      - name: Install and use published container apps anonymously
        run: python3 qa/public_container_check.py runtime/rhyven-linux-x86_64
