[workspace]
members = ["crates/core", "crates/mcp", "crates/tui", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.4.0-rc.10"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/rhyven-ai/rhyven"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
agent-market-core = { path = "crates/core" }
agent-market-mcp = { path = "crates/mcp" }
agent-market-tui = { path = "crates/tui" }

[profile.release]
lto = "thin"
strip = true
